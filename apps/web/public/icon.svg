      <stop offset="0%" stop-color="#C85238"/>
      <stop offset="100%" stop-color="#9C3620"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#551B0F" flood-opacity="0.25"/>
