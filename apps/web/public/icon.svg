<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="airaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D95338"/>
      <stop offset="50%" stop-color="#B5472F"/>
      <stop offset="100%" stop-color="#8E2D18"/>
    </linearGradient>
    <linearGradient id="airaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#551508" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#airaBg)"/>
  
  <!-- Subtle Ambient Top Light -->
  <rect width="512" height="512" rx="124" fill="url(#airaGlow)"/>

  <!-- Logo Mark -->
  <g filter="url(#shadow)">
    <!-- The Outer 'A' Frame: Sweeping Arched Shelter -->
    <path d="M 132 405 L 228 138 C 238 110 274 110 284 138 L 380 405"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="38"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Central Sculpted Heart (Integrated Crossbar of the 'A') -->
    <path d="M 256 242
             C 244 218 214 208 194 226
             C 172 246 174 278 196 304
             L 256 364
             L 316 304
             C 338 278 340 246 318 226
             C 298 208 268 218 256 242 Z"
          fill="#FFFFFF"
          stroke="#FFFFFF"
          stroke-width="6"
          stroke-linejoin="round"/>

    <!-- Dynamic Listening Pulse / EKG Wave carved inside the Heart (in brand terracotta) -->
    <path d="M 188 285 L 220 285 L 232 255 L 248 318 L 264 268 L 276 285 L 324 285"
          fill="none"
          stroke="#B5472F"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Subtle Listening Wave Crest at the Apex of 'A' -->
    <circle cx="256" cy="180" r="14" fill="#FFFFFF"/>
  </g>
</svg>