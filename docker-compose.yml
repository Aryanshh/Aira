services:
  db:
    image: postgres:16-alpine
    container_name: aira_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aira
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aira"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aira_api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/aira
      - APP_ENV=development
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aira_worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/aira
      - APP_ENV=development
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: aira_web
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: ["pnpm", "dev"]

volumes:
  postgres_data:
